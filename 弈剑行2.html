<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>潇濑传 - 增强版武侠RPG</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            font-family: '楷体', serif;
            color: #fff;
        }
        
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        #uiOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
        
        .panel {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #aaa;
            border-radius: 5px;
            padding: 15px;
            margin: 10px;
            box-shadow: 0 0 10px rgba(200, 200, 200, 0.3);
            color: #fff;
        }
        
        #healthBar, #manaBar {
            width: 200px;
            height: 15px;
            background: #333;
            border: 1px solid #666;
            border-radius: 3px;
            overflow: hidden;
            margin: 5px 0;
        }
        
        #healthFill, #manaFill {
            height: 100%;
            transition: width 0.3s;
        }
        
        #healthFill {
            background: linear-gradient(to right, #444, #888, #444);
        }
        
        #manaFill {
            background: linear-gradient(to right, #222, #666, #222);
        }
        
        #characterInfo {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 250px;
        }
        
        #actionPanel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }
        
        .actionBtn {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #aaa;
            color: #fff;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.3s;
            font-family: '楷体', serif;
        }
        
        .actionBtn:hover {
            background: rgba(100, 100, 100, 0.3);
            transform: scale(1.05);
        }
        
        #combatLog {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 300px;
            height: 300px;
            overflow-y: auto;
            overflow-x: hidden;
        }
        
        .logEntry {
            margin: 5px 0;
            padding: 5px;
            background: rgba(50, 50, 50, 0.5);
            border-radius: 3px;
            font-size: 14px;
            border-left: 3px solid #888;
        }
        
        /* 自定义滚动条 */
        #combatLog::-webkit-scrollbar {
            width: 8px;
        }
        
        #combatLog::-webkit-scrollbar-track {
            background: #222;
            border-radius: 4px;
        }
        
        #combatLog::-webkit-scrollbar-thumb {
            background: #666;
            border-radius: 4px;
        }
        
        #combatLog::-webkit-scrollbar-thumb:hover {
            background: #888;
        }
        
        #scene {
            width: 100%;
            height: 100%;
        }
        
        #titleScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: #fff;
        }
        
        #titleScreen h1 {
            font-size: 4em;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #888, 0 0 30px #666;
            color: #fff;
            letter-spacing: 5px;
        }
        
        #titleScreen p {
            font-size: 1.2em;
            margin-bottom: 30px;
            text-align: center;
            max-width: 600px;
            line-height: 1.6;
        }
        
        #startButton {
            background: rgba(0, 0, 0, 0.8);
            border: 3px solid #aaa;
            color: #fff;
            padding: 15px 40px;
            font-size: 1.5em;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: '楷体', serif;
        }
        
        #startButton:hover {
            background: rgba(100, 100, 100, 0.3);
            transform: scale(1.1);
        }
        
        .hidden {
            display: none !important;
        }
        
        /* 战斗动画元素 */
        #battleAnimation {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 10px #000;
            pointer-events: none;
            z-index: 90;
            opacity: 0;
        }
        
        .hit-animation {
            animation: hitEffect 0.5s ease-out;
        }
        
        @keyframes hitEffect {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
        }
        
        /* 特效元素 */
        .effect {
            position: absolute;
            pointer-events: none;
            z-index: 80;
            opacity: 0;
        }
        
        .sword-effect {
            width: 4px;
            height: 100px;
            background: linear-gradient(to bottom, #fff, #aaa, #fff);
            box-shadow: 0 0 10px #fff, 0 0 20px #aaa;
        }
        
        .heal-effect {
            width: 20px;
            height: 20px;
            background: #0f0;
            border-radius: 50%;
            box-shadow: 0 0 10px #0f0, 0 0 20px #0f0;
        }
        
        .lightning-effect {
            width: 2px;
            height: 150px;
            background: linear-gradient(to bottom, #0ff, #0af, #0ff);
            box-shadow: 0 0 15px #0ff, 0 0 30px #0af;
        }
        
        .fire-effect {
            width: 20px;
            height: 20px;
            background: radial-gradient(circle, #f80, #f40, #f00);
            border-radius: 50%;
            box-shadow: 0 0 15px #f80, 0 0 30px #f00;
        }
        
        /* 装备面板 */
        #equipmentPanel {
            position: absolute;
            top: 10px;
            left: 280px;
            width: 200px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #aaa;
            border-radius: 5px;
            padding: 10px;
            color: #fff;
            z-index: 101;
        }
        
        .equipment-item {
            padding: 5px;
            margin: 5px 0;
            background: rgba(50, 50, 50, 0.5);
            border: 1px solid #666;
            border-radius: 3px;
            cursor: pointer;
        }
        
        .equipment-item:hover {
            background: rgba(100, 100, 100, 0.5);
        }
        
        .equipped {
            background: rgba(100, 100, 100, 0.8);
            border-color: #aaa;
        }
        
        /* 招式面板 */
        #techniquePanel {
            position: absolute;
            top: 10px;
            left: 500px;
            width: 200px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #aaa;
            border-radius: 5px;
            padding: 10px;
            color: #fff;
            z-index: 101;
        }
        
        .technique-item {
            padding: 5px;
            margin: 5px 0;
            background: rgba(50, 50, 50, 0.5);
            border: 1px solid #666;
            border-radius: 3px;
            cursor: pointer;
        }
        
        .technique-item:hover {
            background: rgba(100, 100, 100, 0.5);
        }
        
        .locked {
            color: #666;
            cursor: not-allowed;
        }
        
        /* 存档按钮 */
        #saveLoadPanel {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 10px;
            z-index: 101;
        }
        
        .save-load-btn {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #aaa;
            color: #fff;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            pointer-events: auto;
            font-family: '楷体', serif;
        }
        
        .save-load-btn:hover {
            background: rgba(100, 100, 100, 0.3);
        }
        
        /* 装备选择弹窗 */
        #equipmentPopup {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #aaa;
            border-radius: 5px;
            padding: 20px;
            z-index: 200;
            color: #fff;
            text-align: center;
            min-width: 300px;
        }
        
        .popup-close {
            margin-top: 15px;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #aaa;
            color: #fff;
            border-radius: 5px;
            cursor: pointer;
        }
        
        /* 技能解锁提示 */
        .skill-unlock {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #0f0;
            border-radius: 5px;
            padding: 20px;
            z-index: 150;
            color: #0f0;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            animation: skillUnlock 2s ease-out forwards;
        }
        
        @keyframes skillUnlock {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5); }
        }
        
        /* 角色动作动画 */
        .player-attack {
            animation: playerAttack 0.5s ease-in-out;
        }
        
        @keyframes playerAttack {
            0% { transform: translate(0, 0); }
            25% { transform: translate(20px, 0); }
            50% { transform: translate(0, 0); }
            75% { transform: translate(-10px, 0); }
            100% { transform: translate(0, 0); }
        }
        
        .enemy-hit {
            animation: enemyHit 0.3s ease;
        }
        
        @keyframes enemyHit {
            0% { background-color: transparent; }
            50% { background-color: rgba(255, 0, 0, 0.5); }
            100% { background-color: transparent; }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="titleScreen">
            <h1>潇濑传</h1>
            <p>踏入这个充满蛊真人风格的武侠世界，体验刀光剑影与蛊虫之术的交融<br>在这个黑白分明的江湖中，寻找属于你的武道真谛</p>
            <button id="startButton">开始游戏</button>
        </div>
        
        <canvas id="scene"></canvas>
        
        <div id="uiOverlay">
            <div id="characterInfo" class="panel">
                <h3>侠客：潇濑</h3>
                <p>门派：弈剑门</p>
                <p>等级：<span id="levelText">15</span></p>
                <p>生命值：<span id="healthText">100/100</span></p>
                <div id="healthBar"><div id="healthFill" style="width: 100%;"></div></div>
                <p>内力值：<span id="manaText">80/80</span></p>
                <div id="manaBar"><div id="manaFill" style="width: 100%;"></div></div>
                <p>攻击力：<span id="attackText">45</span></p>
                <p>防御力：<span id="defenseText">30</span></p>
                <p>经验值：<span id="expText">0/100</span></p>
            </div>
            
            <div id="equipmentPanel" class="panel">
                <h3>装备</h3>
                <div class="equipment-item" data-type="weapon" id="weaponSlot">空手</div>
                <div class="equipment-item" data-type="armor" id="armorSlot">布衣</div>
                <div class="equipment-item" data-type="accessory" id="accessorySlot">无</div>
            </div>
            
            <div id="techniquePanel" class="panel">
                <h3>招式</h3>
                <div class="technique-item" id="techAttack">普通攻击</div>
                <div class="technique-item" id="techSword">剑气斩</div>
                <div class="technique-item" id="techHeal">回春术</div>
                <div class="technique-item" id="techSpecial">万剑归宗</div>
                <div class="technique-item" id="techLightning">雷电术</div>
            </div>
            
            <div id="combatLog" class="panel">
                <h3>战斗日志</h3>
                <div id="logContent">
                    <div class="logEntry">欢迎来到潇濑传！</div>
                    <div class="logEntry">按WASD移动，鼠标控制视角</div>
                    <div class="logEntry">发现敌人，准备战斗！</div>
                </div>
            </div>
            
            <div id="actionPanel">
                <button class="actionBtn" id="attackBtn">攻击 (A)</button>
                <button class="actionBtn" id="defendBtn">防御 (D)</button>
                <button class="actionBtn" id="skill1Btn">剑气斩 (Q)</button>
                <button class="actionBtn" id="skill2Btn">回春术 (E)</button>
                <button class="actionBtn" id="specialBtn">绝招·万剑归宗 (R)</button>
                <button class="actionBtn" id="lightningBtn">雷电术 (T)</button>
            </div>
            
            <div id="saveLoadPanel">
                <button class="save-load-btn" id="saveBtn">保存</button>
                <button class="save-load-btn" id="loadBtn">读取</button>
            </div>
        </div>
        
        <div id="battleAnimation"></div>
    </div>

    <script>
        // 游戏状态管理
        const gameState = {
            health: 100,
            maxHealth: 100,
            mana: 80,
            maxMana: 80,
            attack: 45,
            defense: 30,
            level: 15,
            exp: 0,
            expToNext: 100,
            enemies: [
                { name: "黑衣刺客", health: 60, maxHealth: 60, attack: 25 },
                { name: "山贼头目", health: 80, maxHealth: 80, attack: 30 },
                { name: "邪教护法", health: 100, maxHealth: 100, attack: 35 },
                { name: "毒蛊师", health: 120, maxHealth: 120, attack: 40 },
                { name: "魔教长老", health: 150, maxHealth: 150, attack: 45 },
                { name: "血刀门主", health: 180, maxHealth: 180, attack: 50 },
                { name: "天山童姥", health: 200, maxHealth: 200, attack: 55 },
                { name: "东方不败", health: 250, maxHealth: 250, attack: 60 }
            ],
            currentEnemyIndex: 0,
            inCombat: false,
            gameStarted: false,
            playerX: 0,
            playerY: 0,
            enemyX: 0,
            enemyY: 0,
            animationPhase: 0,
            equipment: {
                weapon: null,
                armor: null,
                accessory: null
            },
            techniques: {
                sword: true,
                heal: true,
                special: true,
                lightning: true
            },
            inventory: [],
            unlockedSkills: []
        };

        // 装备定义
        const equipmentList = [
            { id: 'sword1', name: '青锋剑', type: 'weapon', attack: 10, description: '基础铁剑' },
            { id: 'sword2', name: '玄铁剑', type: 'weapon', attack: 20, description: '沉重坚韧的玄铁剑' },
            { id: 'sword3', name: '倚天剑', type: 'weapon', attack: 30, description: '削铁如泥的神兵利器' },
            { id: 'sword4', name: '屠龙刀', type: 'weapon', attack: 35, description: '号令天下的绝世神兵' },
            { id: 'armor1', name: '轻甲', type: 'armor', defense: 5, description: '灵活的轻甲' },
            { id: 'armor2', name: '重甲', type: 'armor', defense: 10, description: '防御力强大的重甲' },
            { id: 'armor3', name: '金丝软甲', type: 'armor', defense: 15, description: '刀枪不入的宝甲' },
            { id: 'acc1', name: '玉佩', type: 'accessory', maxHealth: 10, description: '增加生命上限' },
            { id: 'acc2', name: '灵石', type: 'accessory', maxMana: 10, description: '增加内力上限' },
            { id: 'acc3', name: '太极图', type: 'accessory', attack: 5, defense: 5, description: '攻守兼备的神器' }
        ];

        // DOM元素引用
        const startButton = document.getElementById('startButton');
        const titleScreen = document.getElementById('titleScreen');
        const healthText = document.getElementById('healthText');
        const healthFill = document.getElementById('healthFill');
        const manaText = document.getElementById('manaText');
        const manaFill = document.getElementById('manaFill');
        const levelText = document.getElementById('levelText');
        const attackText = document.getElementById('attackText');
        const defenseText = document.getElementById('defenseText');
        const expText = document.getElementById('expText');
        const logContent = document.getElementById('logContent');
        const attackBtn = document.getElementById('attackBtn');
        const defendBtn = document.getElementById('defendBtn');
        const skill1Btn = document.getElementById('skill1Btn');
        const skill2Btn = document.getElementById('skill2Btn');
        const specialBtn = document.getElementById('specialBtn');
        const lightningBtn = document.getElementById('lightningBtn');
        const battleAnimation = document.getElementById('battleAnimation');
        const saveBtn = document.getElementById('saveBtn');
        const loadBtn = document.getElementById('loadBtn');
        const weaponSlot = document.getElementById('weaponSlot');
        const armorSlot = document.getElementById('armorSlot');
        const accessorySlot = document.getElementById('accessorySlot');

        // 开始游戏
        startButton.addEventListener('click', () => {
            titleScreen.classList.add('hidden');
            gameState.gameStarted = true;
            initGame();
        });

        // 初始化游戏
        function initGame() {
            updateUI();
            setupEventListeners();
            startCombat();
            gameState.playerX = window.innerWidth / 2 - 150;
            gameState.playerY = window.innerHeight / 2 + 50;
            gameState.enemyX = window.innerWidth / 2 + 150;
            gameState.enemyY = window.innerHeight / 2 + 50;
            
            // 添加初始装备
            gameState.inventory.push(equipmentList[0]); // 青锋剑
            gameState.inventory.push(equipmentList[4]); // 轻甲
            updateEquipmentDisplay();
        }

        // 设置事件监听器
        function setupEventListeners() {
            attackBtn.addEventListener('click', () => performAction('attack'));
            defendBtn.addEventListener('click', () => performAction('defend'));
            skill1Btn.addEventListener('click', () => performAction('skill1'));
            skill2Btn.addEventListener('click', () => performAction('skill2'));
            specialBtn.addEventListener('click', () => performAction('special'));
            lightningBtn.addEventListener('click', () => performAction('lightning'));
            
            // 装备槽点击事件
            weaponSlot.addEventListener('click', () => openEquipmentMenu('weapon'));
            armorSlot.addEventListener('click', () => openEquipmentMenu('armor'));
            accessorySlot.addEventListener('click', () => openEquipmentMenu('accessory'));
            
            // 招式点击事件
            document.getElementById('techAttack').addEventListener('click', () => performAction('attack'));
            document.getElementById('techSword').addEventListener('click', () => performAction('skill1'));
            document.getElementById('techHeal').addEventListener('click', () => performAction('skill2'));
            document.getElementById('techSpecial').addEventListener('click', () => performAction('special'));
            document.getElementById('techLightning').addEventListener('click', () => performAction('lightning'));
            
            // 保存/读取按钮
            saveBtn.addEventListener('click', saveGame);
            loadBtn.addEventListener('click', loadGame);
            
            // 键盘快捷键
            document.addEventListener('keydown', (e) => {
                switch(e.key.toLowerCase()) {
                    case 'a': performAction('attack'); break;
                    case 'd': performAction('defend'); break;
                    case 'q': performAction('skill1'); break;
                    case 'e': performAction('skill2'); break;
                    case 'r': performAction('special'); break;
                    case 't': performAction('lightning'); break;
                }
            });
        }

        // 更新UI
        function updateUI() {
            healthText.textContent = `${gameState.health}/${gameState.maxHealth}`;
            healthFill.style.width = `${(gameState.health / gameState.maxHealth) * 100}%`;
            
            manaText.textContent = `${gameState.mana}/${gameState.maxMana}`;
            manaFill.style.width = `${(gameState.mana / gameState.maxMana) * 100}%`;
            
            levelText.textContent = gameState.level;
            attackText.textContent = gameState.attack;
            defenseText.textContent = gameState.defense;
            expText.textContent = `${gameState.exp}/${gameState.expToNext}`;
            
            // 更新招式解锁状态
            document.getElementById('techSpecial').classList.toggle('locked', !gameState.techniques.special);
            document.getElementById('techLightning').classList.toggle('locked', !gameState.techniques.lightning);
        }

        // 更新装备显示
        function updateEquipmentDisplay() {
            // 更新武器槽
            if (gameState.equipment.weapon) {
                weaponSlot.textContent = gameState.equipment.weapon.name;
                weaponSlot.classList.add('equipped');
            } else {
                weaponSlot.textContent = '空手';
                weaponSlot.classList.remove('equipped');
            }
            
            // 更新护甲槽
            if (gameState.equipment.armor) {
                armorSlot.textContent = gameState.equipment.armor.name;
                armorSlot.classList.add('equipped');
            } else {
                armorSlot.textContent = '布衣';
                armorSlot.classList.remove('equipped');
            }
            
            // 更新饰品槽
            if (gameState.equipment.accessory) {
                accessorySlot.textContent = gameState.equipment.accessory.name;
                accessorySlot.classList.add('equipped');
            } else {
                accessorySlot.textContent = '无';
                accessorySlot.classList.remove('equipped');
            }
            
            // 计算总属性
            calculateTotalStats();
        }

        // 计算总属性
        function calculateTotalStats() {
            let totalAttack = 45; // 基础攻击
            let totalDefense = 30; // 基础防御
            let totalMaxHealth = 100; // 基础生命
            let totalMaxMana = 80; // 基础内力
            
            // 添加装备属性
            if (gameState.equipment.weapon) {
                totalAttack += gameState.equipment.weapon.attack || 0;
            }
            
            if (gameState.equipment.armor) {
                totalDefense += gameState.equipment.armor.defense || 0;
            }
            
            if (gameState.equipment.accessory) {
                totalMaxHealth += gameState.equipment.accessory.maxHealth || 0;
                totalMaxMana += gameState.equipment.accessory.maxMana || 0;
                totalAttack += gameState.equipment.accessory.attack || 0;
                totalDefense += gameState.equipment.accessory.defense || 0;
            }
            
            // 更新全局状态
            gameState.attack = totalAttack;
            gameState.defense = totalDefense;
            const oldMaxHealth = gameState.maxHealth;
            const oldMaxMana = gameState.maxMana;
            
            gameState.maxHealth = totalMaxHealth;
            gameState.maxMana = totalMaxMana;
            
            // 如果最大值增加了，生命值也相应增加
            if (oldMaxHealth < gameState.maxHealth) {
                gameState.health += gameState.maxHealth - oldMaxHealth;
            }
            
            if (oldMaxMana < gameState.maxMana) {
                gameState.mana += gameState.maxMana - oldMaxMana;
            }
            
            // 确保当前值不超过最大值
            gameState.health = Math.min(gameState.health, gameState.maxHealth);
            gameState.mana = Math.min(gameState.mana, gameState.maxMana);
            
            updateUI();
        }

        // 打开装备菜单
        function openEquipmentMenu(type) {
            // 过滤出对应类型的装备
            const availableItems = gameState.inventory.filter(item => item.type === type);
            
            // 创建装备选择弹窗
            const popup = document.createElement('div');
            popup.id = 'equipmentPopup';
            popup.innerHTML = `
                <h3>选择${type === 'weapon' ? '武器' : type === 'armor' ? '护甲' : '饰品'}</h3>
            `;
            
            availableItems.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'equipment-item';
                itemDiv.textContent = `${item.name} (${item.description})`;
                itemDiv.style.cursor = 'pointer';
                itemDiv.style.margin = '10px 0';
                itemDiv.style.padding = '10px';
                
                // 如果是当前装备，高亮显示
                if (gameState.equipment[type] && gameState.equipment[type].id === item.id) {
                    itemDiv.style.background = 'rgba(100, 100, 100, 0.8)';
                }
                
                itemDiv.addEventListener('click', () => {
                    // 卸下当前装备
                    if (gameState.equipment[type]) {
                        gameState.inventory.push(gameState.equipment[type]);
                    }
                    
                    // 装备新物品
                    gameState.equipment[type] = item;
                    
                    // 从库存中移除
                    gameState.inventory = gameState.inventory.filter(invItem => invItem.id !== item.id);
                    
                    updateEquipmentDisplay();
                    document.body.removeChild(popup);
                });
                
                popup.appendChild(itemDiv);
            });
            
            // 添加关闭按钮
            const closeBtn = document.createElement('button');
            closeBtn.textContent = '关闭';
            closeBtn.className = 'popup-close';
            closeBtn.addEventListener('click', () => {
                document.body.removeChild(popup);
            });
            
            popup.appendChild(closeBtn);
            document.body.appendChild(popup);
        }

        // 添加战斗日志
        function addLog(message) {
            const logEntry = document.createElement('div');
            logEntry.className = 'logEntry';
            logEntry.textContent = message;
            logContent.appendChild(logEntry);
            logContent.scrollTop = logContent.scrollHeight;
        }

        // 显示战斗动画
        function showBattleAnimation(text, color = '#fff', x = null, y = null) {
            battleAnimation.textContent = text;
            battleAnimation.style.color = color;
            battleAnimation.style.opacity = '1';
            
            if (x !== null && y !== null) {
                battleAnimation.style.left = `${x}px`;
                battleAnimation.style.top = `${y}px`;
            } else {
                battleAnimation.style.left = '50%';
                battleAnimation.style.top = '50%';
            }
            
            setTimeout(() => {
                battleAnimation.style.opacity = '0';
            }, 1000);
        }

        // 创建特效
        function createEffect(type, x, y) {
            const effect = document.createElement('div');
            effect.className = `effect ${type}-effect`;
            effect.style.left = `${x}px`;
            effect.style.top = `${y}px`;
            effect.style.opacity = '1';
            document.body.appendChild(effect);
            
            // 动画
            let startOpacity = 1;
            const fadeEffect = setInterval(() => {
                startOpacity -= 0.05;
                effect.style.opacity = startOpacity;
                
                if (startOpacity <= 0) {
                    clearInterval(fadeEffect);
                    document.body.removeChild(effect);
                }
            }, 50);
        }

        // 显示技能解锁提示
        function showSkillUnlock(skillName) {
            const unlockElement = document.createElement('div');
            unlockElement.className = 'skill-unlock';
            unlockElement.textContent = `解锁技能：${skillName}！`;
            document.body.appendChild(unlockElement);
            
            setTimeout(() => {
                document.body.removeChild(unlockElement);
            }, 2000);
        }

        // 开始战斗
        function startCombat() {
            if (gameState.currentEnemyIndex >= gameState.enemies.length) {
                addLog("所有敌人都已被击败！你成为了武林盟主！");
                showBattleAnimation('武林盟主！', '#ff0', gameState.playerX, gameState.playerY - 80);
                return;
            }
            
            const enemy = gameState.enemies[gameState.currentEnemyIndex];
            addLog(`遭遇敌人：${enemy.name}！`);
            showBattleAnimation(`${enemy.name}出现！`, '#ff6666', gameState.enemyX, gameState.enemyY - 60);
            gameState.inCombat = true;
        }

        // 执行行动
        function performAction(action) {
            if (!gameState.inCombat || !gameState.gameStarted) return;
            
            // 检查当前敌人是否存在
            if (gameState.currentEnemyIndex >= gameState.enemies.length) {
                addLog("没有敌人可以攻击！");
                return;
            }
            
            const enemy = gameState.enemies[gameState.currentEnemyIndex];
            let playerDamage = 0;
            let playerHeal = 0;
            let manaCost = 0;
            let animationText = '';
            
            switch(action) {
                case 'attack':
                    playerDamage = Math.floor(gameState.attack * (0.8 + Math.random() * 0.4));
                    manaCost = 5;
                    animationText = `-${playerDamage}`;
                    showBattleAnimation(animationText, '#ff0', gameState.enemyX, gameState.enemyY - 40);
                    createEffect('sword', gameState.playerX + 15, gameState.playerY - 20);
                    addLog(`你对${enemy.name}造成了${playerDamage}点伤害！`);
                    // 添加攻击动画
                    document.getElementById('scene').classList.add('player-attack');
                    setTimeout(() => {
                        document.getElementById('scene').classList.remove('player-attack');
                    }, 500);
                    break;
                    
                case 'skill1': // 剑气斩
                    if (gameState.mana < 15) {
                        addLog("内力不足！");
                        return;
                    }
                    playerDamage = Math.floor(gameState.attack * 1.5 * (0.8 + Math.random() * 0.4));
                    manaCost = 15;
                    animationText = `剑气斩! -${playerDamage}`;
                    showBattleAnimation(animationText, '#0ff', gameState.enemyX, gameState.enemyY - 40);
                    createEffect('sword', gameState.playerX + 15, gameState.playerY - 20);
                    createEffect('sword', gameState.playerX + 20, gameState.playerY - 25);
                    createEffect('sword', gameState.playerX + 25, gameState.playerY - 30);
                    addLog(`你施展剑气斩，对${enemy.name}造成了${playerDamage}点伤害！`);
                    // 添加攻击动画
                    document.getElementById('scene').classList.add('player-attack');
                    setTimeout(() => {
                        document.getElementById('scene').classList.remove('player-attack');
                    }, 500);
                    break;
                    
                case 'skill2': // 回春术
                    if (gameState.mana < 20) {
                        addLog("内力不足！");
                        return;
                    }
                    playerHeal = Math.floor(gameState.maxHealth * 0.2);
                    manaCost = 20;
                    animationText = `回春术! +${playerHeal}`;
                    showBattleAnimation(animationText, '#0f0', gameState.playerX, gameState.playerY - 60);
                    createEffect('heal', gameState.playerX, gameState.playerY - 40);
                    createEffect('heal', gameState.playerX - 10, gameState.playerY - 50);
                    createEffect('heal', gameState.playerX + 10, gameState.playerY - 50);
                    addLog(`你施展回春术，恢复了${playerHeal}点生命值！`);
                    break;
                    
                case 'special': // 绝招
                    if (gameState.mana < 40) {
                        addLog("内力不足！");
                        return;
                    }
                    playerDamage = Math.floor(gameState.attack * 2.5 * (0.8 + Math.random() * 0.4));
                    manaCost = 40;
                    animationText = `万剑归宗!!! -${playerDamage}`;
                    showBattleAnimation(animationText, '#f0f', gameState.enemyX, gameState.enemyY - 40);
                    createEffect('sword', gameState.playerX + 15, gameState.playerY - 20);
                    createEffect('sword', gameState.playerX + 20, gameState.playerY - 25);
                    createEffect('sword', gameState.playerX + 25, gameState.playerY - 30);
                    createEffect('sword', gameState.playerX + 30, gameState.playerY - 35);
                    createEffect('sword', gameState.playerX + 35, gameState.playerY - 40);
                    addLog(`你施展绝招万剑归宗，对${enemy.name}造成了${playerDamage}点巨大伤害！`);
                    // 添加强力攻击动画
                    document.getElementById('scene').classList.add('player-attack');
                    setTimeout(() => {
                        document.getElementById('scene').classList.remove('player-attack');
                    }, 500);
                    break;
                    
                case 'lightning': // 雷电术
                    if (gameState.mana < 30) {
                        addLog("内力不足！");
                        return;
                    }
                    if (!gameState.techniques.lightning) {
                        addLog("尚未学会此技能！");
                        return;
                    }
                    playerDamage = Math.floor(gameState.attack * 2.0 * (0.8 + Math.random() * 0.4));
                    manaCost = 30;
                    animationText = `雷电术!!! -${playerDamage}`;
                    showBattleAnimation(animationText, '#0ff', gameState.enemyX, gameState.enemyY - 40);
                    createEffect('lightning-effect', gameState.playerX, gameState.playerY - 30);
                    createEffect('lightning-effect', gameState.playerX + 10, gameState.playerY - 35);
                    createEffect('lightning-effect', gameState.playerX - 10, gameState.playerY - 35);
                    addLog(`你施展雷电术，对${enemy.name}造成了${playerDamage}点雷电伤害！`);
                    break;
                    
                case 'defend':
                    showBattleAnimation('防御!', '#0f0', gameState.playerX, gameState.playerY - 60);
                    addLog("你进入防御状态，下次受到的伤害减半！");
                    setTimeout(() => {
                        enemyAttack(enemy, true); // 防御状态下敌人攻击
                    }, 1500);
                    updateUI();
                    return;
            }
            
            // 消耗内力
            gameState.mana = Math.max(0, gameState.mana - manaCost);
            
            // 造成伤害或治疗
            if (playerDamage > 0) {
                enemy.health -= playerDamage;
                if (enemy.health <= 0) {
                    enemy.health = 0;
                    showBattleAnimation(`${enemy.name}倒下!`, '#f00', gameState.enemyX, gameState.enemyY - 40);
                    addLog(`${enemy.name}被击败了！获得经验50点。`);
                    gameState.exp += 50;
                    
                    // 随机掉落装备
                    if (Math.random() > 0.6) {
                        const randomEquip = equipmentList[Math.floor(Math.random() * equipmentList.length)];
                        gameState.inventory.push(randomEquip);
                        addLog(`获得了装备：${randomEquip.name}！`);
                    }
                    
                    checkLevelUp();
                    
                    // 下一敌人
                    gameState.currentEnemyIndex++;
                    if (gameState.currentEnemyIndex < gameState.enemies.length) {
                        setTimeout(() => {
                            startCombat();
                        }, 2000);
                    } else {
                        addLog("恭喜！你完成了所有挑战！");
                    }
                }
            }
            
            if (playerHeal > 0) {
                gameState.health = Math.min(gameState.maxHealth, gameState.health + playerHeal);
            }
            
            // 敌人反击
            setTimeout(() => {
                if (enemy.health > 0 && gameState.currentEnemyIndex < gameState.enemies.length) {
                    enemyAttack(enemy, action === 'defend');
                }
            }, 1500);
            
            updateUI();
        }

        // 敌人攻击
        function enemyAttack(enemy, isDefending) {
            // 检查当前敌人是否存在
            if (!gameState.inCombat || gameState.currentEnemyIndex >= gameState.enemies.length) return;
            
            // 重新获取当前敌人引用（因为可能在之前的攻击中切换了敌人）
            const currentEnemy = gameState.enemies[gameState.currentEnemyIndex];
            if (!currentEnemy || currentEnemy.health <= 0) return;
            
            let damage = Math.floor(currentEnemy.attack * (0.7 + Math.random() * 0.6));
            
            // 应用防御
            damage = Math.max(1, damage - gameState.defense * 0.3);
            
            if (isDefending) {
                damage = Math.floor(damage * 0.5);
                showBattleAnimation(`敌击${damage}防`, '#ff0', gameState.playerX, gameState.playerY - 40);
                addLog(`${currentEnemy.name}攻击你，但由于你在防御，只受到了${damage}点伤害！`);
            } else {
                showBattleAnimation(`-${damage}`, '#f00', gameState.playerX, gameState.playerY - 40);
                addLog(`${currentEnemy.name}对你造成了${damage}点伤害！`);
            }
            
            gameState.health = Math.max(0, gameState.health - damage);
            
            if (gameState.health <= 0) {
                gameState.health = 0;
                showBattleAnimation('你败了...', '#f00', gameState.playerX, gameState.playerY - 60);
                addLog("你被击败了！游戏结束...");
                gameState.inCombat = false;
            }
            
            updateUI();
        }

        // 检查升级
        function checkLevelUp() {
            if (gameState.exp >= gameState.expToNext) {
                gameState.level++;
                gameState.exp -= gameState.expToNext;
                gameState.expToNext = Math.floor(gameState.expToNext * 1.5);
                
                // 提升属性
                gameState.maxHealth += 10;
                gameState.health = gameState.maxHealth;
                gameState.maxMana += 8;
                gameState.mana = gameState.maxMana;
                gameState.attack += 5;
                gameState.defense += 3;
                
                // 解锁新技能
                if (gameState.level >= 20 && !gameState.techniques.special) {
                    gameState.techniques.special = true;
                    gameState.unlockedSkills.push('万剑归宗');
                    showSkillUnlock('万剑归宗');
                    addLog("解锁新技能：万剑归宗！");
                }
                
                if (gameState.level >= 25 && !gameState.techniques.lightning) {
                    gameState.techniques.lightning = true;
                    gameState.unlockedSkills.push('雷电术');
                    showSkillUnlock('雷电术');
                    addLog("解锁新技能：雷电术！");
                }
                
                showBattleAnimation(`升级! ${gameState.level}`, '#0f0', gameState.playerX, gameState.playerY - 60);
                addLog(`恭喜升级！现在是第${gameState.level}级！属性全面提升！`);
                updateUI();
            }
        }

        // 保存游戏
        function saveGame() {
            try {
                const saveData = {
                    gameState: gameState,
                    timestamp: new Date().toISOString()
                };
                
                localStorage.setItem('xiaolaiSave', JSON.stringify(saveData));
                addLog("游戏已保存！");
            } catch (e) {
                addLog("保存失败：" + e.message);
            }
        }

        // 读取游戏
        function loadGame() {
            try {
                const saveData = localStorage.getItem('xiaolaiSave');
                if (saveData) {
                    const parsed = JSON.parse(saveData);
                    // 恢复游戏状态
                    Object.assign(gameState, parsed.gameState);
                    
                    // 重新计算属性
                    calculateTotalStats();
                    updateUI();
                    updateEquipmentDisplay();
                    
                    addLog("游戏已读取！");
                } else {
                    addLog("没有找到存档！");
                }
            } catch (e) {
                addLog("读取失败：" + e.message);
            }
        }

        // 简单的3D场景渲染（模拟）
        function renderScene() {
            if (!gameState.gameStarted) return;
            
            const canvas = document.getElementById('scene');
            const ctx = canvas.getContext('2d');
            
            // 设置画布大小
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            // 绘制背景 - 蛊真人风格的黑白水墨
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制水墨山峦
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            for (let i = 0; i < 5; i++) {
                const x = (i * 200 - Date.now() / 50) % (canvas.width + 400) - 200;
                drawInkMountain(ctx, x, canvas.height - 100, 200, 100);
            }
            
            // 绘制水墨树木
            ctx.strokeStyle = '#444';
            for (let i = 0; i < 8; i++) {
                const x = (i * 100 - Date.now() / 20) % (canvas.width + 200) - 100;
                drawInkTree(ctx, x, canvas.height - 50);
            }
            
            // 绘制水墨河流
            ctx.strokeStyle = '#113';
            ctx.lineWidth = 3;
            ctx.beginPath();
            for (let x = 0; x < canvas.width; x += 10) {
                const y = canvas.height - 30 + Math.sin(x / 30 + Date.now() / 1000) * 5;
                if (x === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.stroke();
            
            // 绘制玩家角色
            drawPlayer(ctx, gameState.playerX, gameState.playerY);
            
            // 绘制敌人
            if (gameState.inCombat && gameState.currentEnemyIndex < gameState.enemies.length) {
                const enemy = gameState.enemies[gameState.currentEnemyIndex];
                drawEnemy(ctx, gameState.enemyX, gameState.enemyY, enemy.name);
            }
            
            requestAnimationFrame(renderScene);
        }
        
        function drawInkMountain(ctx, x, y, width, height) {
            ctx.beginPath();
            ctx.moveTo(x, y);
            // 创建水墨山脉效果
            for (let i = 0; i <= width; i += 10) {
                const offsetX = Math.sin(i / 20) * 5;
                const offsetY = -Math.pow((i - width/2), 2) / (width/2) + height + offsetX;
                if (i === 0) {
                    ctx.lineTo(x + i, y - offsetY);
                } else {
                    ctx.lineTo(x + i, y - offsetY);
                }
            }
            ctx.lineTo(x + width, y);
            ctx.closePath();
            ctx.stroke();
        }
        
        function drawInkTree(ctx, x, y) {
            // 树干 - 简单水墨线条
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x, y - 40);
            ctx.stroke();
            
            // 树冠 - 水墨晕染效果
            ctx.beginPath();
            ctx.arc(x, y - 45, 15, 0, Math.PI * 2);
            ctx.stroke();
        }
        
        function drawPlayer(ctx, x, y) {
            // 身体 - 水墨风格
            ctx.strokeStyle = '#666';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(x, y - 40); // 头部中心
            ctx.lineTo(x, y); // 身体
            ctx.moveTo(x, y - 10); // 左臂
            ctx.lineTo(x - 15, y - 20);
            ctx.moveTo(x, y - 10); // 右臂
            ctx.lineTo(x + 15, y - 20);
            ctx.moveTo(x, y); // 左腿
            ctx.lineTo(x - 10, y + 20);
            ctx.moveTo(x, y); // 右腿
            ctx.lineTo(x + 10, y + 20);
            ctx.stroke();
            
            // 武器 - 剑
            ctx.strokeStyle = '#888';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x + 15, y - 20);
            ctx.lineTo(x + 30, y - 40);
            ctx.stroke();
        }
        
        function drawEnemy(ctx, x, y, name) {
            // 敌人身体 - 水墨风格
            ctx.strokeStyle = '#444';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(x, y - 40); // 头部中心
            ctx.lineTo(x, y); // 身体
            ctx.moveTo(x, y - 10); // 左臂
            ctx.lineTo(x - 15, y - 20);
            ctx.moveTo(x, y - 10); // 右臂
            ctx.lineTo(x + 15, y - 20);
            ctx.moveTo(x, y); // 左腿
            ctx.lineTo(x - 10, y + 20);
            ctx.moveTo(x, y); // 右腿
            ctx.lineTo(x + 10, y + 20);
            ctx.stroke();
            
            // 敌人武器 - 刀
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x - 15, y - 20);
            ctx.lineTo(x - 30, y - 35);
            ctx.stroke();
            
            // 名字
            ctx.fillStyle = '#aaa';
            ctx.font = '14px 楷体';
            ctx.textAlign = 'center';
            ctx.fillText(name, x, y - 60);
        }
        
        // 启动渲染循环
        renderScene();
        
        // 窗口大小调整
        window.addEventListener('resize', () => {
            if (gameState.gameStarted) {
                gameState.playerX = window.innerWidth / 2 - 150;
                gameState.playerY = window.innerHeight / 2 + 50;
                gameState.enemyX = window.innerWidth / 2 + 150;
                gameState.enemyY = window.innerHeight / 2 + 50;
                renderScene();
            }
        });
    </script>
</body>
</html>
